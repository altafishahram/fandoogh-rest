name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (for example v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Publish signed release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Verify tag matches plugin version
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-${GITHUB_REF_NAME}}"
          VERSION=$(grep -oP "^\\s*\\*\\s*Version:\\s*\\K[0-9.]+" fondogh-online-menu.php | head -n1)
          CONST=$(grep -oP "define\\('RMM_VERSION',\\s*'\\K[0-9.]+" fondogh-online-menu.php | head -n1)
          echo "tag=$TAG version=$VERSION const=$CONST"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Tag $TAG does not match plugin version $VERSION"
            exit 1
          fi
          if [ "$VERSION" != "$CONST" ]; then
            echo "::error::Header version $VERSION and RMM_VERSION $CONST differ"
            exit 1
          fi
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build package and checksum
        run: python tools/build-release.py

      - name: Verify package contents
        run: python tools/preflight.py --package-only

      - name: Create signed release manifest
        env:
          RELEASE_PRIVATE_KEY: ${{ secrets.FONDOOGH_RELEASE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_PRIVATE_KEY:-}" ]; then
            echo "::error::Repository secret FONDOOGH_RELEASE_PRIVATE_KEY is required to sign releases."
            exit 1
          fi
          umask 077
          printf '%s\n' "$RELEASE_PRIVATE_KEY" > "$RUNNER_TEMP/release-private.pem"
          python - <<'PY'
          import hashlib, json, os
          version = os.environ["RELEASE_VERSION"]
          tag = os.environ["RELEASE_TAG"]
          with open("fondogh-online-menu.zip", "rb") as f:
              digest = hashlib.sha256(f.read()).hexdigest()
          manifest = {
              "schema": 1,
              "tag": tag,
              "version": version,
              "package": "fondogh-online-menu.zip",
              "sha256": digest,
          }
          with open("fondogh-online-menu.manifest.json", "w", encoding="utf-8", newline="\n") as f:
              json.dump(manifest, f, sort_keys=True, separators=(",", ":"))
              f.write("\n")
          PY
          openssl dgst -sha256 -sign "$RUNNER_TEMP/release-private.pem" -out "$RUNNER_TEMP/manifest.sig" fondogh-online-menu.manifest.json
          base64 -w 0 "$RUNNER_TEMP/manifest.sig" > fondogh-online-menu.manifest.sig
          rm -f "$RUNNER_TEMP/release-private.pem" "$RUNNER_TEMP/manifest.sig"

      - name: Verify detached signature before publishing
        run: |
          set -euo pipefail
          openssl dgst -sha256 -verify includes/Core/release-public-key.pem -signature <(base64 -d fondogh-online-menu.manifest.sig) fondogh-online-menu.manifest.json

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            fondogh-online-menu.zip
            fondogh-online-menu.zip.sha256
            fondogh-online-menu.manifest.json
            fondogh-online-menu.manifest.sig
          generate_release_notes: true
          fail_on_unmatched_files: true
